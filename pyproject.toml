[project]
name = "fastsignals"
version = "0.1.0"
description = "Telegram bot for monitoring Solana SPL arbitrage spreads with security checks and 1-click Jupiter links."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4,<4",
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.19,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
